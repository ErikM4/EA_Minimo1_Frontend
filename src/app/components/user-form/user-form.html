<h1>{{ id() ? 'Editar usuario' : 'Nuevo usuario' }}</h1>

@if (error()) {
  <p class="alert" role="alert">{{ error() }}</p>
}

@if (loading()) {
  <p class="muted">Cargando usuario...</p>
} @else if (loadFailed()) {
  <a routerLink="/users">Volver a la lista de usuarios</a>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      Nombre *
      <input type="text" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.hasError('required')) {
        <small class="field-error">El nombre es obligatorio.</small>
      } @else if (form.controls.name.touched && form.controls.name.hasError('minlength')) {
        <small class="field-error">El nombre debe tener al menos 2 caracteres.</small>
      }
    </label>

    <label>
      Email *
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.hasError('required')) {
        <small class="field-error">El email es obligatorio.</small>
      } @else if (form.controls.email.touched && form.controls.email.hasError('email')) {
        <small class="field-error">Introduce un email válido.</small>
      }
    </label>

    <label>
      Rol *
      <select formControlName="role">
        <option value="USER">Usuario</option>
        <option value="STORE_HOST">Anfitrión de tienda</option>
        <option value="ADMIN">Administrador</option>
      </select>
    </label>

    <label>
      {{ id() ? 'Nueva contraseña (opcional)' : 'Contraseña *' }}
      <input
        type="password"
        formControlName="password"
        [attr.autocomplete]="id() ? 'new-password' : 'new-password'"
      />
      @if (form.controls.password.touched && form.controls.password.hasError('required')) {
        <small class="field-error">La contraseña es obligatoria.</small>
      } @else if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
        <small class="field-error">La contraseña debe tener al menos 6 caracteres.</small>
      }
    </label>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
      <a routerLink="/users">Cancelar</a>
    </div>
  </form>
}
