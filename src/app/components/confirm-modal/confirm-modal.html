@if (isOpen()) {
  <div
    class="overlay"
    role="presentation"
    tabindex="-1"
    (click)="cancel()"
    (keydown.escape)="cancel()"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown.escape)="cancel(); $event.stopPropagation()"
    >
      <h2 id="confirm-modal-title">{{ displayTitle() }}</h2>
      <p>{{ displayMessage() }}</p>
      <div class="actions">
        <button type="button" class="secondary" (click)="cancel()">
          {{ cancelText() }}
        </button>
        <button type="button" class="danger" (click)="confirm()">
          {{ displayConfirmText() }}
        </button>
      </div>
    </div>
  </div>
}
