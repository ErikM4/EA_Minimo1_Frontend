<h1>{{ id() ? 'Editar actividad' : 'Nueva actividad' }}</h1>

@if (error()) {
  <p class="alert" role="alert">{{ error() }}</p>
}

@if (loading()) {
  <p class="muted">Cargando actividad...</p>
} @else if (loadFailed()) {
  <a routerLink="/activities">Volver a actividades</a>
} @else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      Título *
      <input type="text" formControlName="title" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <small class="field-error">El título es obligatorio y debe tener al menos 2 caracteres.</small>
      }
    </label>

    <label>
      Descripción *
      <textarea rows="4" formControlName="description"></textarea>
      @if (form.controls.description.touched && form.controls.description.invalid) {
        <small class="field-error">La descripción es obligatoria.</small>
      }
    </label>

    <div class="form-grid">
      <label>
        Categoría *
        <select formControlName="category">
          @for (category of categories; track category) {
            <option [value]="category">{{ category }}</option>
          }
        </select>
      </label>
      <label>
        Subcategoría *
        <select formControlName="subcategory">
          @for (subcategory of subcategories; track subcategory) {
            <option [value]="subcategory">{{ subcategory }}</option>
          }
        </select>
      </label>
      <label>
        Modalidad *
        <select formControlName="modality">
          @for (modality of modalities; track modality) {
            <option [value]="modality">{{ modality }}</option>
          }
        </select>
      </label>
      <label>
        Estado *
        <select formControlName="status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>
      </label>
    </div>

    <fieldset>
      <legend>Ubicación</legend>
      <label>
        Dirección *
        <input type="text" formControlName="addressName" />
        @if (form.controls.addressName.touched && form.controls.addressName.invalid) {
          <small class="field-error">La dirección es obligatoria.</small>
        }
      </label>
      <div class="form-grid">
        <label>
          Longitud *
          <input type="number" formControlName="longitude" min="-180" max="180" step="any" />
        </label>
        <label>
          Latitud *
          <input type="number" formControlName="latitude" min="-90" max="90" step="any" />
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Horario y capacidad</legend>
      <div class="form-grid">
        <label>
          Inicio *
          <input type="datetime-local" formControlName="startTime" />
        </label>
        <label>
          Fin *
          <input type="datetime-local" formControlName="endTime" />
          @if (form.controls.endTime.touched && form.hasError('invalidSchedule')) {
            <small class="field-error">El final debe ser posterior al inicio.</small>
          }
        </label>
        <label>
          Participantes mínimos *
          <input type="number" formControlName="minParticipants" min="1" />
        </label>
        <label>
          Participantes máximos *
          <input type="number" formControlName="maxParticipants" min="1" />
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Precio</legend>
      <div class="form-grid">
        <label>
          Precio *
          <input type="number" formControlName="price" min="0" step="0.01" />
        </label>
        <label>
          Información del premio
          <input type="text" formControlName="prizeInfo" />
        </label>
      </div>
    </fieldset>

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
      <a routerLink="/activities">Cancelar</a>
    </div>
  </form>
}
